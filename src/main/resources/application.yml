spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: saas-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas-db}?options=-c%20TimeZone=${DB_TZ:Asia/Kolkata}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20

    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/common
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  tenant:
    mode: ${TENANT_MODE:schema} # toggle: filter | schema
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:certs/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:certs/public_key.pem}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}

springdoc:
  default-produces-media-type: application/json

  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: list
    try-it-out-enabled: true

  api-docs:
    path: /api-docs