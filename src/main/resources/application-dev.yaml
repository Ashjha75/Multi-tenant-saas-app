spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:saas-db}:${DB_PORT:5432}/${DB_NAME:saas-app-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG

