version: '3.8'

services:
  postgres:
    image: postgres:17.5
    container_name: saas-db

    environment:
      POSTGRES_DB: saas-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d saas-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # ── Spring Boot App ───────────────────────────────
  app:
    build: .
    container_name: saas-app
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_HOST: postgres          # docker-compose service name
      DB_PORT: 5432
      DB_NAME: saas-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_TZ: Asia/Kolkata
      TENANT_MODE: schema

    ports:
      - "8080:8080"

    restart: unless-stopped

networks:
  default:
    name: saas-app-network

volumes:
  postgres_data: