version: '3.8'

services:

  # ── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: postgres:17.5
    container_name: saas-db

    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ:                ${DB_TZ:-Asia/Kolkata}
      PGTZ:              ${DB_TZ:-Asia/Kolkata}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # ── Spring Boot App ───────────────────────────────────────────
  app:
    build: .
    container_name: saas-app

    # Load ALL env vars from the .env file at compose start.
    # On your VPS, create this file manually (see .env.example).
    # Never commit .env to git — it is in .gitignore.
    env_file:
      - .env

    # Override DB_HOST so the app reaches the postgres *container*,
    # not localhost (which would be the app container's own loopback).
    environment:
      DB_HOST: postgres   # always the docker-compose service name

    volumes:
      # Mount JWT PEM keys — generated once on the VPS, never in the image
      - ./certs:/app/certs:ro

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-8080}:8080"

    restart: unless-stopped

networks:
  default:
    name: saas-app-network

volumes:
  postgres_data: