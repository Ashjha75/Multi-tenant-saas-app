version: '3.8'

services:
  postgres:
    image: postgres:17.5
    container_name: saas-db

    environment:
      POSTGRES_DB: saas-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d saas-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

networks:
  default:
    name: saas-app-network

volumes:
  postgres_data: